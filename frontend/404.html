<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없어요 | 내집로그</title>
<style>
  :root{--bg:#F6F5F1;--card:#FFFFFF;--t1:#15191F;--t2:#5B6472;--bd:#E3E1DA;--acc:#173A63;--acc-ink:#FFFFFF}
  @media (prefers-color-scheme: dark){:root{--bg:#0E1520;--card:#151E2B;--t1:#E8ECF1;--t2:#A9B4C2;--bd:#26344A;--acc:#8DB3E2;--acc-ink:#0E1520}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--t1);
    font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}
  main{width:100%;max-width:420px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px 24px;text-align:center}
  h1{font-size:20px;font-weight:700;margin-bottom:8px}
  p{font-size:14px;color:var(--t2);margin-bottom:20px}
  .row{display:flex;flex-direction:column;gap:10px}
  a{display:block;padding:12px 16px;border-radius:10px;font-size:14px;font-weight:600;text-decoration:none}
  .pri{background:var(--acc);color:var(--acc-ink)}
  .sec{border:1px solid var(--bd);color:var(--t1)}
</style>
</head>
<body>
<main>
  <h1>페이지를 찾을 수 없어요</h1>
  <p>주소가 바뀌었거나 없는 페이지예요.</p>
  <div class="row">
    <a class="pri" href="/">첫 화면으로 가기</a>
    <a class="sec" href="/region">지역별 실거래 보기</a>
  </div>
</main>
</body>
</html>
