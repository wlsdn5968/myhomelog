name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-audit:
    name: Install & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 24 (프로덕션 런타임과 일치)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root deps (npm ci)
        run: npm ci --no-audit --no-fund

      - name: npm audit (high+ only, production)
        # 개발 의존성 취약점은 별도 정책 — 프로덕션 빌드 반영분만 게이트
        run: npm audit --omit=dev --audit-level=high

      - name: Install backend deps
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: npm audit backend
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      # ── dev 트리 가시성 (비차단) — 감사 #15·#34 ────────────────────────────
      # [왜] 위 두 게이트는 `--omit=dev` 라 개발 의존성(eslint 계열 68패키지 등)이
      #   **아무 신호도 남기지 않는다**. 그 판단 자체는 맞다 — dev 취약점으로 배포를 막으면
      #   실익 없이 릴리스만 멈춘다. 문제는 "막지 않는다"가 "보이지도 않는다"가 된 것이다.
      # [그래서] 차단하지 않되(`|| true`) 로그에는 남긴다. critical 만 본다 — 노이즈를 만들면
      #   아무도 안 읽고, 그럼 없는 것과 같다.
      # ⚠ 이 스텝은 **절대 실패하면 안 된다**. 게이트로 승격하려면 별도 결정이 필요하다.
      - name: npm audit (dev 트리 포함 — 가시성 전용, 비차단)
        run: |
          echo "── root (dev 포함) ──"
          npm audit --audit-level=critical || true
          echo "── backend (dev 포함) ──"
          (cd backend && npm audit --audit-level=critical || true)

  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # CI-GATE-DECOUPLE-2026-07-25 (Sprint QQQQQQ, improve 감사 CONFIRMED — 실측으로 발동 확인):
    #   기존 `needs: install-audit` 때문에 **npm audit 실패 하나가 모든 품질 검증을 꺼버렸다**.
    #   실측: `npm audit --omit=dev --audit-level=high` exit=1 (high 2건 — axios formDataToJSON
    #   재귀 DoS, form-data CRLF). 그 결과 문법 검사·deps-sync·인라인 JS 검증·XSS 정적검사·
    #   (이번에 추가한) 돈 계산 테스트가 전부 skip 되어 **CI 가 사실상 무방비**였다.
    #   보안 취약점 가시성은 install-audit job 이 계속 빨간불로 유지하고(별도 판단 대상),
    #   코드 품질 게이트는 그와 독립적으로 항상 돌아야 한다.
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 24 (프로덕션 런타임과 일치)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Node syntax check (backend + api)
        # node --check 는 파싱 오류만 잡음 — ESLint 대체가 아니라 최소 안전망
        run: |
          set -e
          find backend api -name '*.js' -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 node --check

      - name: Deps-sync check (root vs backend package.json)
        # 루트 package.json 에 누락된 외부 require → 프로덕션 함수 MODULE_NOT_FOUND 예방
        run: node scripts/check-deps-sync.js

      # ── .env.example 동기화 가시성 (비차단) — Plan 029 ────────────────────────
      # [왜] 코드가 읽는 env 가 .env.example 에 안 적히는 누락이 **세 번 재발**했다.
      #   graceful-degrade 설계라 부팅이 안 깨져서 조용히 넘어간다(계획 005 가 후속을 적어뒀지만
      #   만들어지지 않아 또 누락됐다). 실제로 이번 전수 대조에서 2건이 나왔다.
      # [왜 비차단인가] 이 저장소는 "게이트가 서로를 죽이지 않게 분리"하는 원칙이 있다
      #   (위 CI-GATE-DECOUPLE 주석). 문서 누락으로 문법 검사·테스트를 막지 않는다.
      # ⚠ 이 스텝은 실패해도 job 을 죽이지 않는다. 차단 게이트로의 승격은 별도 결정이다.
      # ⚠ 비차단이라 **아무도 로그를 안 보면 소용없다** — 리뷰 시 이 스텝 출력을 확인할 것.
      - name: .env.example 동기화 확인 (가시성 전용, 비차단)
        run: node scripts/check-env-example.js || true

      # CI-TEST-GATE-2026-07-25 (Sprint QQQQQQ, improve 감사 CONFIRMED):
      #   backend/package.json 에 "test": "node --test" 가 정의돼 있고 로컬에서 통과하는데,
      #   CI 어디에서도 실행하지 않아 **돈 계산 회귀 안전망이 실제로는 꺼져 있었다**
      #   (.husky 없음·pre-commit 훅 없음 — 전수 확인). 특성화 테스트는 규제 LTV·취득세 경계처럼
      #   틀리면 사용자 금전 손실로 이어지는 계산을 고정하는 용도라 CI 게이트가 필수.
      # CI-TEST-DEPS-2026-07-25 (Sprint UUUUUU-4): 원래 주석은 "의존성 0(node:test 내장)이라 install 없이
      #   즉시 실행 가능"이라고 적었는데 **틀렸다**. 테스트 파일 자체는 의존성이 없지만
      #   propertyService → transactionService → @supabase/supabase-js 로 이어져 MODULE_NOT_FOUND 였다.
      #   글롭 문제(UUUUUU-3)에 가려 안 보이던 2차 원인 — 이 job 은 npm ci 를 하지 않는다.
      #   → 테스트 직전에 backend 의존성 설치. install-audit job 과는 파일시스템이 분리돼 있어 중복 설치가
      #     필요하며, 그게 Sprint QQQQQQ 의 job 분리(감사 실패가 품질 게이트를 끄지 않게) 취지에 맞는다.
      - name: Install backend deps (테스트 실행용)
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Run backend tests (money-calculation characterization)
        working-directory: backend
        run: npm test

      - name: JSON config validate
        run: |
          set -e
          for f in package.json backend/package.json vercel.json; do
            [ -f "$f" ] && node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok: $f"
          done

      - name: HTML basic sanity (frontend/index.html exists & <html> present)
        run: |
          test -f frontend/index.html
          grep -q '<html' frontend/index.html
          grep -q '</html>' frontend/index.html

      - name: Frontend inline JS syntax check (classic <script> via vm.Script)
        # HTML sanity 는 <html> 존재만 확인 — 인라인 <script>(~3900줄) 구문은 미검증이었음.
        # classic inline script 만 vm.Script 로 검사. type="module"·application/ld+json·외부 src 는 skip.
        # node 내장 vm 사용 (신규 npm 의존성 없음).
        run: |
          node <<'SCRIPT'
          const fs = require('fs'), vm = require('vm');
          const html = fs.readFileSync('frontend/index.html', 'utf8');
          const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
          let m, i = 0, errs = 0, checked = 0, skipped = 0;
          while ((m = re.exec(html))) {
          i++;
          const attrs = m[1] || '', code = m[2] || '';
          const tm = attrs.match(/type\s*=\s*["']([^"']+)["']/i);
          const type = tm ? tm[1].toLowerCase() : '';
          if (/\bsrc\s*=/.test(attrs)) { skipped++; continue; }
          if (type && !['text/javascript', 'application/javascript'].includes(type)) { skipped++; continue; }
          const startLine = html.slice(0, m.index).split('\n').length;
          try { new vm.Script(code, { filename: 'index.html#' + i + '@L' + startLine }); checked++; }
          catch (e) { errs++; console.error('SYNTAX ERROR script#' + i + ' @L' + startLine + ': ' + e.message); }
          }
          console.log('frontend inline JS: blocks=' + i + ' checked=' + checked + ' skipped=' + skipped + ' errors=' + errs);
          if (checked < 1) { console.error('No inline scripts checked — extractor regex likely broken'); process.exit(1); }
          process.exit(errs ? 1 : 0);
          SCRIPT

      - name: Clause XSS raw-pattern guard (P1 regression)
        # P1-A/t3 에서 escape 한 clause 렌더 패턴이 raw 로 재유입됐는지 정적 검사 (fallback 포함).
        # raw ${c.title}, ${c.title||''}, ${c.content || ''}, ${d.caution ?? ''} 등 → 실패.
        # ${_escHtml(c.title...)} 통과. 삼항 가드 ${d.caution ? `...${_escHtml(d.caution)}...` : ''} 도 통과(오탐 방지).
        # → field 직후 '}' 또는 '||'/'??' fallback 만 raw 로 판정. node 내장만 사용 (신규 의존성 없음).
        run: |
          node <<'SCRIPT'
          const fs = require('fs');
          const html = fs.readFileSync('frontend/index.html', 'utf8');
          const re = /\$\{\s*(?:c\.(?:title|content|reason|law|article|summary)|d\.caution)\s*(?:\}|(?:\|\||\?\?)[^}]*\})/;
          const hits = [];
          html.split('\n').forEach((ln, i) => { if (re.test(ln)) hits.push((i + 1) + ': ' + ln.trim().slice(0, 120)); });
          if (hits.length) { console.error('clause XSS raw-pattern 발견 (P1 회귀 — _escHtml 로 감싸야 함):'); hits.forEach(h => console.error('  ' + h)); process.exit(1); }
          console.log('clause XSS raw-pattern guard: OK (0 raw matches)');
          SCRIPT

      - name: Security regression guard (XSS raw-pattern 재유입 차단)
        # 2026-05 XSS 보강(e177c1b/bc027ff)에서 닫은 raw 패턴 재유입 정적 검사
        # (field-note memo textarea / exportClausePDF title / inline JSON .replace(&#39;) / setAlert raw JSON.stringify)
        run: node scripts/security-regression-check.js

  lint:
    name: Lint (correctness only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # LINT-MINIMAL-2026-08-16 (Plan 020):
    #   [왜 별도 job 인가] 이 레포는 Sprint QQQQQQ 에서 "감사 실패 하나가 모든 품질 게이트를 꺼버린"
    #   사고를 겪고 job 을 분리하는 방침을 세웠다(위 syntax-check 주석 참조). 린트도 같은 원칙으로
    #   독립 job 이다 — 다른 게이트가 죽어도 이건 돌고, 이게 죽어도 다른 건 돈다.
    #   [왜 필요한가] 계획 010 의 결함 B(`fetch` 옵션에 `signal` 키 중복 → 90s 타임아웃이 죽고 180s 적용)는
    #   `no-dupe-keys` 하나면 잡혔다. 중복 키는 **합법 문법**이라 위의 `node --check`·`vm.Script`
    #   구문 검사로는 원리적으로 못 잡는다 — 그래서 별도 도구가 필요하다.
    #   [범위] 정확성 규칙만. 스타일 규칙 0개(들여쓰기·따옴표 논쟁으로 배포가 멈추면 안 된다).
    #   도입 시점 실측: backend/scripts/api 에러 0, 프론트 인라인 에러 1(의도된 카카오 게이트, disable 주석 처리).
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 24 (프로덕션 런타임과 일치)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install root deps (eslint)
        run: npm ci --no-audit --no-fund

      - name: Lint (backend + scripts + api + 프론트 인라인 JS)
        # npm run lint = scripts/extract-inline-js.js 로 **frontend/*.html 전체**의 인라인 <script> 를
        # .lint-tmp/<base>-block<N>.js 에 뽑은 뒤(줄번호 보존) eslint 실행.
        # MULTI-HTML-2026-08-28: index.html 만 보던 것을 billing·terms·privacy·refund 까지 넓혔다 —
        #   그전까지 결제·환불 인라인 JS 는 이 게이트를 그냥 통과했다.
        # 에러만 CI 를 막고 경고는 막지 않는다.
        run: npm run lint

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks 가 과거 커밋까지 스캔

      - name: Run gitleaks
        # SUPPLY-CHAIN-2026-08-16: 가변 태그 → **커밋 SHA 고정**.
        #   태그는 언제든 다른 커밋을 가리키도록 옮길 수 있어, 서드파티 저장소가 탈취되면
        #   우리 워크플로가 조용히 새 코드를 실행한다. 이 액션은 GITHUB_TOKEN 을 받고
        #   fetch-depth:0 로 받은 **전체 커밋 히스토리**를 읽으므로 우선 고정 대상이다.
        #
        # GITLEAKS-V3-2026-08-16: v2 SHA 고정 직후 **v2 에 시한이 있다는 사실을 확인**해 v3 으로 올렸다.
        #   [근거 — 업스트림 v3.0.0 릴리스 노트 원문 확인]
        #     · 2026-06-02: GitHub 러너 기본이 Node 24 로 전환 → v2(node20)는
        #       `ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION=true` 가 있어야만 동작
        #     · **2026-09-16: Node 20 이 러너에서 제거 → v2 는 어떤 우회 플래그로도 동작 중단**
        #   즉 v2 에 SHA 를 고정해두면 한 달 뒤 Secret Scan 이 죽는다 — 공급망 조치가
        #   오히려 시한폭탄을 굳히는 셈이었다.
        #   [변경 범위] 업스트림 명시: "No changes to inputs, outputs, or behavior."
        #     action.yml 의 `using: node20` → `node24` 와 @actions/core 갱신이 전부다(실측 확인).
        #   e0c47f4 = v3·v3.0.0 두 태그가 같이 가리키는 커밋("chore: migrate to Node 24 runtime (v3)",
        #     2026-05-30). `gh api` 로 태그→커밋 해석 + action.yml 의 `using: "node24"` 직접 확인.
        #   ⚠ dependabot(github-actions, weekly)이 SHA 핀도 갱신하므로 수동 추적 불필요.
        #   ⚠ actions/checkout·setup-node 는 GitHub 1st-party 라 아직 고정하지 않았다
        #     (plans/README 백로그에 기록). 필요해지면 같은 방식으로 고정할 것.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 개인/팀 무료 사용 — 라이선스 키 불필요
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  prod-smoke:
    name: Production Smoke Test
    # master push(=squash merge) 직후에만 실행 — PR/feature 브랜치엔 스킵
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [syntax-check]
    steps:
      - uses: actions/checkout@v7

      - name: Wait for Vercel prod redeploy (up to 5min) + probe /api/health
        run: bash scripts/prod-smoke.sh
        env:
          SMOKE_HOST: https://myhomelog.vercel.app
